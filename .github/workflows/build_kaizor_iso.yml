name: Kaizor OS Full Build (Auto Fix)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y g++ make cmake pkg-config \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
            zip unzip wget xz-utils rsync

      - name: Auto Fix Project Source (Permanent Build Fix)
        run: |
          echo "== Fixing duplicate/redefinition issues =="

          # Remove duplicate definitions
          rm -f gui/ui_theme.cpp || true
          rm -f window_manager/window.cpp || true

          # Fix wallpaper engine include issue
          cat > desktop/wallpaper_engine.cpp <<'EOF'
          #include "wallpaper_engine.hpp"
          #include "../gui/ui_theme.hpp"

          WallpaperEngine::WallpaperEngine() {}

          void WallpaperEngine::render(Renderer& renderer) {
              renderer.clear(UITheme::wallpaper());

              renderer.drawRoundedRect(0, 0, 1280, 720, 0, UITheme::wallpaper());

              renderer.drawRoundedRect(120, 120, 420, 300, 28, Color(60, 140, 255, 55));
              renderer.drawRoundedRect(520, 200, 520, 360, 28, Color(255, 120, 180, 45));
              renderer.drawRoundedRect(220, 460, 420, 200, 28, Color(120, 255, 220, 40));
          }
          EOF

          # Force WindowManager header to 1-arg render
          cat > window_manager/window_manager.hpp <<'EOF'
          #pragma once
          #include <vector>
          #include <string>
          #include <SDL2/SDL.h>
          #include "../graphics/renderer.hpp"
          #include "window.hpp"

          class WindowManager {
          private:
              std::vector<Window> windows;
              int focusedWindow;

          public:
              WindowManager();

              void createWindow(
                  int id,
                  const std::string& title,
                  int x,
                  int y,
                  int width,
                  int height
              );

              void render(Renderer& renderer);
              void handleEvents(SDL_Event& event);
          };
          EOF

          # Fix main.cpp render call (remove textRenderer/font args)
          if grep -q "wm.render(renderer, textRenderer" main.cpp; then
            sed -i 's/wm.render(renderer, textRenderer, fontManager.getFont());/wm.render(renderer);/g' main.cpp
          fi

          if grep -q "wm.render(renderer,textRenderer" main.cpp; then
            sed -i 's/wm.render(renderer,textRenderer,fontManager.getFont());/wm.render(renderer);/g' main.cpp
          fi

          echo "== Fix done =="

      - name: Compile KaizorWM
        run: |
          g++ main.cpp \
            graphics/*.cpp \
            gui/*.cpp \
            desktop/*.cpp \
            window_manager/*.cpp \
            apps/*.cpp \
            effects/*.cpp \
            -lSDL2 -lSDL2_ttf -lSDL2_image \
            -o kaizorwm

      - name: Create Kaizor Overlay Folder
        run: |
          mkdir -p build_output/overlay/usr/local/bin
          mkdir -p build_output/overlay/etc/X11/xorg.conf.d
          mkdir -p build_output/overlay/root

          cp kaizorwm build_output/overlay/usr/local/bin/kaizorwm

          cat > build_output/overlay/etc/rc.conf <<'EOF'
          dbus_enable="YES"
          hald_enable="YES"
          moused_enable="YES"
          EOF

          cat > build_output/overlay/etc/rc.local <<'EOF'
          #!/bin/sh
          service dbus start
          service hald start
          service moused start
          su - root -c "startx /usr/local/bin/kaizor-session -- :0 vt1" &
          EOF
          chmod +x build_output/overlay/etc/rc.local

          cat > build_output/overlay/usr/local/bin/kaizor-session <<'EOF'
          #!/bin/sh
          export HOME=/root
          export LANG=en_US.UTF-8
          export SDL_VIDEODRIVER=x11
          exec /usr/local/bin/kaizorwm
          EOF
          chmod +x build_output/overlay/usr/local/bin/kaizor-session

          cat > build_output/overlay/root/.xinitrc <<'EOF'
          exec /usr/local/bin/kaizor-session
          EOF

          cat > build_output/overlay/etc/X11/xorg.conf.d/00-kaizor.conf <<'EOF'
          Section "Device"
              Identifier "Card0"
              Driver "scfb"
          EndSection
          EOF

      - name: Download FreeBSD ISO
        run: |
          mkdir -p build_output/freebsd_iso
          cd build_output/freebsd_iso

          wget -O FreeBSD.iso.xz \
            https://download.freebsd.org/ftp/releases/ISO-IMAGES/14.1/FreeBSD-14.1-RELEASE-amd64-disc1.iso.xz

          unxz FreeBSD.iso.xz
          ls -lh FreeBSD.iso

      - name: Pack Overlay
        run: |
          cd build_output
          tar -czf kaizor_overlay.tar.gz -C overlay .
          ls -lh kaizor_overlay.tar.gz

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaizor-output
          path: |
            kaizorwm
            build_output/kaizor_overlay.tar.gz
            build_output/freebsd_iso/FreeBSD.iso

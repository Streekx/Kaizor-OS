name: Build KaizorWM (Auto Fix + Artifacts)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y g++ make cmake pkg-config \
            libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev \
            zip unzip wget xz-utils rsync

      # ---------------------------
      # AUTO FIX BROKEN DUPLICATES
      # ---------------------------
      - name: Auto Fix Duplicate Source Files
        run: |
          echo "== Removing duplicate inline/outline definition conflicts =="

          # UITheme duplicate definition fix
          if [ -f gui/ui_theme.cpp ]; then
            echo "Deleting gui/ui_theme.cpp"
            rm -f gui/ui_theme.cpp
          fi

          # Window duplicate constructor fix
          if [ -f window_manager/window.cpp ]; then
            echo "Deleting window_manager/window.cpp"
            rm -f window_manager/window.cpp
          fi

          # Fix wrong include in wallpaper engine
          if [ -f desktop/wallpaper_engine.cpp ]; then
            echo "Fixing desktop/wallpaper_engine.cpp"
            cat > desktop/wallpaper_engine.cpp <<'EOF'
          #include "wallpaper_engine.hpp"
          #include "../gui/ui_theme.hpp"

          WallpaperEngine::WallpaperEngine() {}

          void WallpaperEngine::render(Renderer& renderer) {
              renderer.clear(UITheme::wallpaper());

              renderer.drawRoundedRect(80, 60, 1120, 640, 35, Color(40, 50, 90, 255));

              renderer.drawRoundedRect(160, 140, 300, 220, 28, Color(90, 140, 255, 55));
              renderer.drawRoundedRect(520, 220, 260, 200, 28, Color(255, 120, 200, 45));
              renderer.drawRoundedRect(860, 160, 240, 260, 28, Color(120, 255, 220, 40));
          }
          EOF
          fi

          # Force window_manager.hpp to 1-arg render version (safe build)
          if [ -f window_manager/window_manager.hpp ]; then
            echo "Fixing window_manager/window_manager.hpp"
            cat > window_manager/window_manager.hpp <<'EOF'
          #pragma once
          #include <vector>
          #include <string>
          #include <SDL2/SDL.h>
          #include "../graphics/renderer.hpp"
          #include "window.hpp"

          class WindowManager {
          private:
              std::vector<Window> windows;
              int focusedWindow;

          public:
              WindowManager();

              void createWindow(
                  int id,
                  const std::string& title,
                  int x,
                  int y,
                  int width,
                  int height
              );

              void render(Renderer& renderer);
              void handleEvents(SDL_Event& event);
          };
          EOF
          fi

      - name: Compile KaizorWM
        run: |
          g++ main.cpp \
            graphics/*.cpp \
            gui/*.cpp \
            desktop/*.cpp \
            window_manager/*.cpp \
            apps/*.cpp \
            effects/*.cpp \
            -lSDL2 -lSDL2_ttf -lSDL2_image \
            -o kaizorwm

      - name: Create Kaizor Overlay Folder
        run: |
          mkdir -p build_output/overlay/usr/local/bin
          mkdir -p build_output/overlay/etc/X11/xorg.conf.d
          mkdir -p build_output/overlay/root

          cp kaizorwm build_output/overlay/usr/local/bin/kaizorwm

          cat > build_output/overlay/etc/rc.conf <<'EOF'
          dbus_enable="YES"
          hald_enable="YES"
          moused_enable="YES"
          EOF

          cat > build_output/overlay/etc/rc.local <<'EOF'
          #!/bin/sh
          service dbus start
          service hald start
          service moused start
          su - root -c "startx /usr/local/bin/kaizor-session -- :0 vt1" &
          EOF
          chmod +x build_output/overlay/etc/rc.local

          cat > build_output/overlay/usr/local/bin/kaizor-session <<'EOF'
          #!/bin/sh
          export HOME=/root
          export LANG=en_US.UTF-8
          export SDL_VIDEODRIVER=x11
          exec /usr/local/bin/kaizorwm
          EOF
          chmod +x build_output/overlay/usr/local/bin/kaizor-session

          cat > build_output/overlay/root/.xinitrc <<'EOF'
          exec /usr/local/bin/kaizor-session
          EOF

          cat > build_output/overlay/etc/X11/xorg.conf.d/00-kaizor.conf <<'EOF'
          Section "Device"
              Identifier "Card0"
              Driver "scfb"
          EndSection
          EOF

      - name: Download FreeBSD ISO
        run: |
          mkdir -p build_output/freebsd_iso
          cd build_output/freebsd_iso

          wget -O FreeBSD.iso.xz \
            https://download.freebsd.org/ftp/releases/ISO-IMAGES/14.1/FreeBSD-14.1-RELEASE-amd64-disc1.iso.xz

          unxz FreeBSD.iso.xz
          ls -lh FreeBSD.iso

      - name: Pack Overlay
        run: |
          cd build_output
          tar -czf kaizor_overlay.tar.gz -C overlay .
          ls -lh kaizor_overlay.tar.gz

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaizor-output
          path: |
            kaizorwm
            build_output/kaizor_overlay.tar.gz
            build_output/freebsd_iso/FreeBSD.iso
